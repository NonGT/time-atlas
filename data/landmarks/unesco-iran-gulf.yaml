- { id: historic-city-of-yazd, name: เมืองประวัติศาสตร์ยัซด์, en: Historic City of Yazd, shape: town, civ: persia, lat: 31.9006, lon: 54.3696, built: 1400, size: 1500, whs: 1544, inscribed: 2017, wiki: "Yazd", desc: "เมืองอิฐดินกลางทะเลทรายที่มีหอดักลม คานาต และชุมชนโซโรอัสเตอร์ ยังคงสภาพเมืองดั้งเดิมไว้ได้มาก" }
- { id: al-ahsa-oasis, name: โอเอซิสอัลอะห์ซาอ์, en: Al-Ahsa Oasis, shape: terrace, civ: arabia, lat: 25.4294, lon: 49.6219, built: -4000, size: 2000, whs: 1563, inscribed: 2018, wiki: "Al-Ahsa Oasis", builtRange: [-5000, -2000], desc: "โอเอซิสต้นอินทผลัมที่ใหญ่ที่สุดในโลก มีน้ำพุ คลอง และมัสยิดญะวาษาอ์ ผู้คนอาศัยมาตั้งแต่ยุคหินใหม่", uncertain: "ไม่รู้แน่ว่าเริ่มทำเกษตรในโอเอซิสเมื่อไร ปีที่ใส่เป็นค่าประมาณ" }
- { id: bishapur, name: เมืองบีชาปูร์, en: Bishapur, shape: hall, civ: persia, lat: 29.7775, lon: 51.5705, built: 266, size: 150, whs: 1568, inscribed: 2018, wiki: "Bishapur", desc: "เมืองที่ชาปูร์ที่ 1 สร้างหลังชนะจักรพรรดิวาเลเรียน ส่วนหนึ่งของภูมิทัศน์ซาซาเนียนในแคว้นฟาร์สร่วมกับฟีรูซาบาด" }
- { id: trans-iranian-railway, name: ทางรถไฟสายทรานส์อิหร่าน, en: Trans-Iranian Railway, shape: bridge, civ: modern, lat: 35.9006, lon: 52.9967, built: 1938, size: 66, whs: 1585, inscribed: 2021, wiki: "Trans-Iranian Railway", desc: "ทางรถไฟจากทะเลแคสเปียนถึงอ่าวเปอร์เซียยาว 1,394 กิโลเมตร ข้ามเทือกเขาด้วยสะพานอย่างสะพานเวเรสก์" }
- { id: bir-hima, name: ภาพสลักบนหิน บีรฮิมา, en: Bir Hima Petroglyphs, shape: cave, civ: arabia, lat: 18.2492, lon: 44.4518, built: -5000, size: 500, whs: 1619, inscribed: 2021, wiki: "Bir Hima Rock Petroglyphs and Inscriptions", builtRange: [-6000, -4000], desc: "ภาพสลักล่าสัตว์และจารึกหลายภาษาบนเส้นทางคาราวานโบราณใกล้นัจรอน ทำต่อเนื่องมากว่า 7,000 ปี", uncertain: "อายุภาพสลักชุดแรกประมาณว่าราว 7,000 ปีก่อน" }
- { id: hawraman, name: ภูมิทัศน์วัฒนธรรม ฮาวรามาน, en: Hawraman Cultural Landscape, shape: terrace, civ: persia, lat: 35.1074, lon: 46.4779, built: 1500, size: 1500, whs: 1647, inscribed: 2021, wiki: "Cultural Landscape of Uramanat", builtRange: [500, 1800], desc: "หมู่บ้านขั้นบันไดของชาวเคิร์ดเฮารามีบนเทือกเขาซากรอส บ้านซ้อนกันจนหลังคาบ้านหนึ่งเป็นลานของอีกบ้าน", uncertain: "หมู่บ้านค่อย ๆ เติบโตมาหลายร้อยปี ไม่มีปีที่ตั้งชัดเจน" }
- { id: persian-caravanserai, name: คาราวานเซรายเปอร์เซีย, en: Persian Caravanserai, shape: citadel, civ: persia, lat: 35.0584, lon: 51.4201, built: 1600, size: 110, whs: 1668, inscribed: 2023, wiki: "The Persian Caravanserai", desc: "ที่พักกองคาราวานริมเส้นทางการค้าทั่วอิหร่าน 54 แห่ง เช่นเดย์เรกาชีนที่นี่ ซึ่งเป็นหนึ่งในที่ใหญ่ที่สุด" }
- { id: kingdom-of-saba-marib, name: โบราณสถานอาณาจักรซาบา, en: Landmarks of the Kingdom of Saba, shape: temple, civ: arabia, lat: 15.4268, lon: 45.3352, built: -750, size: 100, whs: 1700, inscribed: 2023, wiki: "Landmarks of the Ancient Kingdom of Saba, Marib", builtRange: [-1000, -600], desc: "วิหารและเขื่อนมาริบของอาณาจักรซาบา (ชีบา) ผู้ร่ำรวยจากการค้ากำยานในอาระเบียใต้", uncertain: "ปีสร้างวิหารและเขื่อนประมาณจากจารึก อยู่ราวต้นสหัสวรรษที่ 1 ก่อน ค.ศ." }
- { id: qaryat-al-faw, name: กอรยะตุลฟาว, en: Qaryat al-Faw, shape: town, civ: arabia, lat: 19.7833, lon: 45.1500, built: -100, size: 1000, whs: 1712, inscribed: 2024, wiki: "Qaryat al-Faw", desc: "เมืองหลวงของอาณาจักรคินดะฮ์ริมทะเลทรายรุบอัลคอลี จุดพักบนเส้นทางคาราวานค้ากำยาน" }
- { id: ecbatana, name: เอกบาทานา, en: Ecbatana, shape: mound, civ: persia, lat: 34.8065, lon: 48.5162, built: -700, size: 600, whs: 1716, inscribed: 2024, wiki: "Ecbatana", builtRange: [-800, -550], desc: "เมืองหลวงของจักรวรรดิมีเดีย ต่อมาเป็นนครหลวงฤดูร้อนของกษัตริย์อะคีเมนิด อยู่ใต้เมืองฮามาดานปัจจุบัน", uncertain: "ปีก่อตั้งมาจากเฮโรโดตัส ซากที่ขุดพบส่วนใหญ่เป็นสมัยหลังกว่านั้น" }
- { id: jebel-faya, name: เจเบลฟายา, en: Jebel Faya, shape: cave, civ: paleolithic, lat: 25.1114, lon: 55.8390, built: -10000, size: 200, whs: 1735, inscribed: 2025, wiki: "Jebel Faya", builtRange: [-10000, -5000], desc: "เพิงผาที่พบเครื่องมือหินอายุราว 125,000 ปี หลักฐานว่ามนุษย์ออกจากแอฟริกาผ่านคาบสมุทรอาหรับ", uncertain: "ชั้นที่เก่าที่สุดมีอายุราว 125,000 ปี เก่ากว่าที่แผนที่แสดงได้" }
- { id: khorramabad-valley, name: แหล่งก่อนประวัติศาสตร์ หุบเขาโครามาบัด, en: Khorramabad Valley prehistoric sites, shape: cave, civ: paleolithic, lat: 33.5083, lon: 48.2114, built: -10000, size: 300, whs: 1744, inscribed: 2025, wiki: "", builtRange: [-10000, -8000], desc: "ถ้ำและเพิงผาในเทือกเขาซากรอสที่มนุษย์นีแอนเดอร์ทัลและมนุษย์ปัจจุบันอาศัยมาหลายหมื่นปี", uncertain: "ถ้ำมีร่องรอยมนุษย์ราว 60,000 ปี เก่ากว่าที่แผนที่แสดงได้" }
- { id: alamut-castle, name: ปราสาทอะลามูต, en: Alamut Castle, shape: castle, civ: abbasid, lat: 36.4447, lon: 50.5861, built: 865, size: 400, whs: 1770, inscribed: 2026, wiki: "Alamut Castle", desc: "ป้อมบนยอดผาที่ฮัสซัน-อี ซับบาห์ยึดได้ในปี ค.ศ. 1090 และเป็นฐานของนิกายนิซารีอิสมาอีลีจนมองโกลทำลายปี ค.ศ. 1256" }

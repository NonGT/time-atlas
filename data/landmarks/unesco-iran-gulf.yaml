- { id: qalhat, name: เมืองโบราณกัลฮาต, en: Ancient City of Qalhat, shape: town, civ: arabia, lat: 22.7000, lon: 59.3699, built: 1300, size: 800, whs: 1537, inscribed: 2018, wiki: "Qalhat", desc: "เมืองท่าสำคัญของอาณาจักรฮอร์มุซที่มาร์โค โปโลและอิบน์ บัตตูตะฮ์เคยแวะ ถูกโปรตุเกสเผาในปี ค.ศ. 1508" }

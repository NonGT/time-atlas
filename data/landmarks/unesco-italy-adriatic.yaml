- { id: great-spa-towns, name: "เมืองสปาใหญ่แห่งยุโรป", en: "Great Spa Towns of Europe", shape: town, civ: low-countries, lat: 50.4922, lon: 5.8669, built: 1800, size: 800, whs: 1613, inscribed: 2021, wiki: "Great Spa Towns of Europe", desc: "เมืองน้ำแร่ 11 แห่งใน 7 ประเทศที่รุ่งเรืองช่วงปี 1700–1930 จุดนี้คือเมืองสปาในเบลเยียม ที่มาของคำว่า \"สปา\"" }
- { id: scrovegni-chapel, name: "โบสถ์สโครเวญี ปาโดวา", en: "Scrovegni Chapel, Padua", shape: church, civ: italy, lat: 45.4119, lon: 11.8796, built: 1305, size: 30, whs: 1623, inscribed: 2021, wiki: "Scrovegni Chapel", desc: "โบสถ์น้อยที่จอตโตวาดจิตรกรรมทั้งหลังราวปี 1305 หนึ่งในแปดอาคารที่มีจิตรกรรมฝาผนังศตวรรษที่ 14 ของปาโดวา" }
- { id: plecnik-ljubljana, name: "งานของเปลชนิก ลูบลิยานา", en: "Plečnik's Ljubljana", shape: bridge, civ: modern, lat: 46.0511, lon: 14.5061, built: 1932, size: 40, whs: 1643, inscribed: 2021, wiki: "The works of Jože Plečnik in Ljubljana – Human Centred Urban Design", desc: "สะพาน ตลาด ห้องสมุด และสวนที่สถาปนิกโยเจ เปลชนิกออกแบบระหว่างสองสงครามโลก ปรับลูบลิยานาให้เป็นเมืองหลวงที่เน้นผู้คน" }
- { id: porticoes-of-bologna, name: "ระเบียงเสาโบโลญญา", en: "Porticoes of Bologna", shape: town, civ: italy, lat: 44.4938, lon: 11.3426, built: 1288, size: 1500, whs: 1650, inscribed: 2021, wiki: "Porticoes of Bologna", desc: "ทางเดินซุ้มโค้งมีหลังคายาวรวมราว 62 กม. กฎหมายเมืองปี 1288 กำหนดให้บ้านใหม่ทุกหลังต้องมีระเบียงเสา" }
- { id: appian-way, name: "ถนนแอปเปียน", en: "Appian Way", shape: wall, civ: roman, lat: 41.8414, lon: 12.5325, built: -312, size: 500, whs: 1708, inscribed: 2024, wiki: "Appian Way", desc: "ถนนสายสำคัญสายแรกของโรม เริ่มสร้าง 312 ปีก่อน ค.ศ. จากโรมถึงบรินดีซี ยาวราว 540 กม. ได้ชื่อว่า \"ราชินีแห่งถนน\"" }
- { id: domus-de-janas, name: "สุสานหินโดมุสเดยานัส", en: "Domus de Janas", shape: cave, civ: megalithic-europe, lat: 40.6319, lon: 8.3289, built: -3500, builtRange: [-4000, -2500], size: 100, whs: 1730, inscribed: 2025, wiki: "Domus de Janas", desc: "สุสานห้องเล็กที่สกัดเข้าไปในหินกว่า 3,500 แห่งทั่วซาร์ดิเนีย ชื่อแปลว่า \"บ้านของภูต\" จุดนี้คือสุสานอังเกลูรูจู", uncertain: "สกัดต่อเนื่องหลายสมัยราว 4000–2500 ปีก่อน ค.ศ." }

- { id: tomb-of-askia, name: สุสานอัสกียา, en: Tomb of Askia, shape: pyramid, civ: west-africa, lat: 16.2897, lon: -0.0444, built: 1495, size: 20, whs: 1139, inscribed: 2004, wiki: "Tomb of Askia", desc: "สุสานพีระมิดดินสูง 17 เมตรของจักรพรรดิอัสกียา มุฮัมมัดแห่งซองไฮ ที่เมืองเกา" }
- { id: koutammakou, name: ดินแดนกูตัมมากู, en: Koutammakou, shape: town, civ: west-africa, lat: 10.1000, lon: 1.0667, built: 1700, size: 1000, whs: 1140, inscribed: 2004, wiki: "Koutammakou", desc: "ดินแดนชาวบาตัมมาริบา บ้านดินทรงหอคอยสองชั้นชื่อตาเกียนตา กลายเป็นสัญลักษณ์ของโตโก" }
- { id: mulanje-mountain, name: ภูเขามูลันเจ, en: Mount Mulanje, shape: mountain, site: true, civ: central-africa, lat: -15.9000, lon: 35.6500, built: 1500, size: 2000, whs: 1201, inscribed: 2025, wiki: "Mulanje Massif", desc: "ภูเขาหินแกรนิตที่ชาวพื้นเมืองในมาลาวีถือเป็นที่สถิตของบรรพบุรุษและเทพเจ้า", builtRange: [1000, 1800], uncertain: "ภูเขาเป็นที่ศักดิ์สิทธิ์มานานหลายศตวรรษ ไม่มีปีเริ่มต้นที่แน่ชัด" }
- { id: senegambia-stone-circles, name: วงหินเซเนแกมเบีย, en: Stone Circles of Senegambia, shape: ring, civ: west-africa, lat: 13.6900, lon: -14.8800, built: -300, size: 30, whs: 1226, inscribed: 2006, wiki: "Senegambian stone circles", desc: "วงหินนับพันวงเหนือหลุมศพตามลุ่มแม่น้ำแกมเบีย กลุ่มที่วัสซูเป็นที่รู้จักที่สุด", builtRange: [-300, 1600], uncertain: "วงหินสร้างกันต่อเนื่องราว 3 ศตวรรษก่อน ค.ศ. ถึงศตวรรษที่ 16" }
- { id: aapravasi-ghat, name: ท่าอาปราวาสี, en: Aapravasi Ghat, shape: hall, civ: england, lat: -20.1586, lon: 57.5031, built: 1849, size: 60, whs: 1227, inscribed: 2006, wiki: "Aapravasi Ghat", desc: "ด่านรับแรงงานรับจ้างจากอินเดียในมอริเชียส ผ่านที่นี่เกือบครึ่งล้านคนหลังยกเลิกทาส" }
- { id: twyfelfontein, name: ภาพสลักหินทไวเฟิลฟอนเทน, en: Twyfelfontein, shape: rockart, civ: central-africa, lat: -20.5956, lon: 14.3726, built: -4000, size: 300, whs: 1255, inscribed: 2007, wiki: "Twyfelfontein", desc: "ภาพสลักหินกว่า 2,000 ภาพในนามิเบีย รูปแรด ช้าง ยีราฟ และรอยเท้าสัตว์ ฝีมือชาวซาน", builtRange: [-4000, 1000], uncertain: "ภาพสลักกำหนดอายุได้ยาก ภาพเก่าสุดอาจราว 6,000 ปี" }
- { id: le-morne-brabant, name: ภูเขาเลอมอร์นบราบองต์, en: Le Morne Brabant, shape: mountain, site: true, civ: east-africa, lat: -20.4606, lon: 57.3136, built: 1750, size: 500, whs: 1259, inscribed: 2008, wiki: "Le Morne Brabant", desc: "ภูเขาริมทะเลในมอริเชียสที่ทาสหลบหนีใช้ซ่อนตัว สัญลักษณ์ของการต่อสู้เพื่ออิสรภาพของทาส", builtRange: [1700, 1835], uncertain: "ทาสหนีมาซ่อนตัวที่นี่ตลอดศตวรรษที่ 18 จนถึงการเลิกทาสในปี 1835 ไม่มีปีเริ่มที่แน่ชัด" }
- { id: richtersveld, name: ภูมิทัศน์ริชเตอร์สเฟลด์, en: Richtersveld Cultural Landscape, shape: mountain, site: true, civ: central-africa, lat: -28.6000, lon: 17.2039, built: 1, size: 2000, whs: 1265, inscribed: 2007, wiki: "Richtersveld", desc: "ทะเลทรายภูเขาที่ชาวนามายังเลี้ยงสัตว์ย้ายที่ตามฤดูกาลและอยู่ในกระท่อมเสื่อแบบดั้งเดิม", builtRange: [-500, 500], uncertain: "การเลี้ยงสัตว์ย้ายที่ของชาวโคยโคยและนามาสืบมาราว 2,000 ปี ไม่มีปีเริ่มที่แน่ชัด" }
- { id: agadez, name: เมืองเก่าอากาเดซ, en: Historic Centre of Agadez, shape: town, civ: west-africa, lat: 16.9744, lon: 7.9896, built: 1500, size: 1000, whs: 1268, inscribed: 2013, wiki: "Historic Centre of Agadez", desc: "เมืองดินประตูทะเลทรายสะฮาราของชาวตูอาเรก มีหออะซานดินสูง 27 เมตร สูงที่สุดในโลก" }
- { id: cidade-velha, name: ซีดาดึแวลยา, en: Cidade Velha, shape: town, civ: portugal, lat: 14.9167, lon: -23.6042, built: 1500, size: 500, whs: 1310, inscribed: 2009, wiki: "Cidade Velha", desc: "เมืองอาณานิคมยุโรปแห่งแรกในเขตร้อน บนเกาะเคปเวิร์ด เป็นจุดพักของการค้าทาสข้ามแอตแลนติก" }
- { id: grand-bassam, name: เมืองเก่ากร็องบาซาม, en: Grand-Bassam, shape: town, civ: france, lat: 5.1965, lon: -3.7368, built: 1893, size: 800, whs: 1322, inscribed: 2012, wiki: "Historic Town of Grand-Bassam", desc: "เมืองหลวงแรกของอาณานิคมฝรั่งเศสในโกตดิวัวร์ อาคารอาณานิคมริมทะเลสาบและหมู่บ้านชาวประมง" }

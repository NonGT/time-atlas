- { id: bassari-country, name: ดินแดนบัสซารี, en: Bassari Country, shape: hills, site: true, civ: west-africa, lat: 12.5933, lon: -12.8458, built: 1300, size: 2000, whs: 1407, inscribed: 2012, wiki: "Bassari Country", desc: "ภูมิทัศน์ภูเขาของชาวบัสซารี ฟูลา และเบดิก ที่ยังรักษาหมู่บ้านและพิธีกรรมดั้งเดิม", builtRange: [1000, 1700], uncertain: "หมู่บ้านในพื้นที่ตั้งขึ้นทีละกลุ่ม ไม่มีปีเริ่มที่แน่ชัด" }
- { id: thimlich-ohinga, name: ทิมลิช โอฮิงกา, en: Thimlich Ohinga, shape: ring, civ: east-africa, lat: -0.8913, lon: 34.3261, built: 1500, size: 150, whs: 1450, inscribed: 2018, wiki: "Thimlich Ohinga", desc: "รั้วหินแห้งล้อมหมู่บ้านในเคนยา ก่อโดยไม่ใช้ปูน ตัวอย่างที่สมบูรณ์ที่สุดของแถบทะเลสาบวิกตอเรีย" }
- { id: ennedi-rock-art, name: ที่ราบสูงเอนเนดี, en: Ennedi Massif, shape: rockart, site: true, civ: central-africa, lat: 17.2500, lon: 22.0000, built: -5000, size: 1000, whs: 1475, inscribed: 2016, wiki: "Ennedi Plateau", desc: "หน้าผาหินทรายกลางสะฮาราในชาด มีภาพเขียนหลายพันภาพตั้งแต่ยุคที่สะฮารายังเขียวขจี", builtRange: [-7000, 500], uncertain: "ภาพเขียนกำหนดอายุได้ยาก ภาพเก่าสุดน่าจะจากยุคสะฮาราชื้น" }
- { id: mbanza-kongo, name: อึมบังซา-กงกู, en: Mbanza Kongo, shape: town, civ: central-africa, lat: -6.2667, lon: 14.2500, built: 1400, size: 800, whs: 1511, inscribed: 2017, wiki: "M'banza-Kongo", desc: "เมืองหลวงอาณาจักรคองโก มีซากโบสถ์คูลุมบิมบีปี 1549 หนึ่งในโบสถ์เก่าที่สุดในแอฟริกาใต้สะฮารา", builtRange: [1350, 1450], uncertain: "ไม่รู้ปีตั้งเมืองที่แน่ชัด ราชสำนักคองโกน่าจะอยู่ที่นี่ตั้งแต่ราวศตวรรษที่ 14" }
- { id: khomani, name: ภูมิทัศน์วัฒนธรรมโคมานี, en: ǂKhomani Cultural Landscape, shape: hills, site: true, civ: central-africa, lat: -25.6876, lon: 20.3746, built: -10000, size: 2000, whs: 1545, inscribed: 2017, wiki: "", desc: "ผืนทรายคาลาฮารีที่ชาวซานโคมานีล่าสัตว์และเก็บของป่าสืบต่อจากยุคหิน", uncertain: "ร่องรอยมนุษย์ในพื้นที่เก่าตั้งแต่ยุคหิน ไม่มีปีเริ่มที่แน่ชัด" }
- { id: asmara, name: แอสมารา เมืองสมัยใหม่, en: Asmara, shape: town, civ: modern, lat: 15.3353, lon: 38.9358, built: 1938, size: 1500, whs: 1550, inscribed: 2017, wiki: "Asmara", desc: "เมืองหลวงเอริเทรียที่อิตาลีสร้างช่วงทศวรรษ 1930 อาคารอาร์ตเดโคและโมเดิร์นยังครบ เช่นปั๊มน้ำมันเฟียตตาเกลียโร" }
- { id: kigali-genocide-memorial, name: อนุสรณ์สถาน การฆ่าล้างเผ่าพันธุ์ในรวันดา, en: Rwanda Genocide Memorials, shape: hall, civ: east-africa, lat: -1.9306, lon: 30.0606, built: 2004, size: 60, whs: 1586, inscribed: 2023, wiki: "List of Rwandan genocide memorials", desc: "อนุสรณ์ที่กิโซซีและอีกสามแห่ง รำลึกชาวทุตซีราว 800,000 คนที่ถูกสังหารในปี 1994" }
- { id: burkina-iron-sites, name: แหล่งถลุงเหล็กโบราณ บูร์กินาฟาโซ, en: Ancient Ferrous Metallurgy Sites of Burkina Faso, shape: factory, civ: west-africa, lat: 12.5878, lon: -3.3290, built: -800, size: 100, whs: 1602, inscribed: 2019, wiki: "Ancient Ferrous Metallurgy Sites of Burkina Faso", desc: "เตาถลุงเหล็กโบราณ แห่งที่ดูรูลาเก่าราว 2,800 ปี หลักฐานการทำเหล็กยุคแรกของแอฟริกา" }
- { id: gedeo-landscape, name: ภูมิทัศน์วัฒนธรรมเกเดโอ, en: Gedeo Cultural Landscape, shape: forest, site: true, civ: ethiopia, lat: 5.1167, lon: 38.6667, built: 1000, size: 2000, whs: 1641, inscribed: 2023, wiki: "Gedeo Cultural Landscape", desc: "ไร่กาแฟใต้ร่มไม้ของชาวเกเดโอบนที่สูงเอธิโอเปีย ปะปนกับเสาหินโบราณนับพันต้น", builtRange: [900, 1500], uncertain: "เสาหินในพื้นที่ยังกำหนดอายุไม่แน่ชัด" }
- { id: ivory-coast-sudanese-mosques, name: มัสยิดแบบซูดาน ทางเหนือของโกตดิวัวร์, en: Sudanese-style Mosques of Côte d'Ivoire, shape: mosque, civ: west-africa, lat: 10.4903, lon: -6.4102, built: 1700, size: 25, whs: 1648, inscribed: 2021, wiki: "Sudanese style mosques in northern Côte d'Ivoire", desc: "มัสยิดดินเล็กๆ 8 หลัง มีไม้ค้ำยื่นจากผนังและหอทรงกรวย ตามเส้นทางค้าขายข้ามสะฮารา", builtRange: [1600, 1900], uncertain: "มัสยิดแต่ละหลังสร้างคนละสมัย ระหว่างศตวรรษที่ 17 ถึง 19" }
- { id: mandela-legacy-sites, name: แหล่งมรดกเนลสัน แมนเดลา, en: Nelson Mandela Legacy Sites, shape: hall, civ: central-africa, lat: -25.7404, lon: 28.2122, built: 1913, size: 280, whs: 1676, inscribed: 2024, wiki: "Union Buildings", desc: "สถานที่ในการต่อสู้กับอพาร์ไทด์ เช่นชาร์ปวิลล์ ไปจนถึงอาคารยูเนียนที่แมนเดลาสาบานตนเป็นประธานาธิบดีปี 1994" }
- { id: tiebele-royal-court, name: ราชสำนักเตียเบเล, en: Royal Court of Tiébélé, shape: town, civ: west-africa, lat: 11.0897, lon: -0.9616, built: 1700, size: 100, whs: 1713, inscribed: 2024, wiki: "Royal Court of Tiébélé", desc: "บ้านดินของชาวกัสเซนาที่ผู้หญิงทาลวดลายเรขาคณิตสีแดง ดำ ขาว ใหม่ทุกปี", builtRange: [1500, 1800], uncertain: "ไม่รู้แน่ว่าราชสำนักตั้งขึ้นเมื่อไร คาดว่าราวศตวรรษที่ 16 ถึง 18" }
- { id: gedi-ruins, name: ซากเมืองเกดี, en: Ruins of Gedi, shape: town, civ: swahili, lat: -3.3092, lon: 40.0167, built: 1400, size: 400, whs: 1720, inscribed: 2024, wiki: "Ruins of Gedi", desc: "ซากเมืองสวาฮีลีกลางป่าชายฝั่งเคนยา มีมัสยิด วัง และบ้านหินปะการัง ถูกทิ้งร้างราวศตวรรษที่ 17" }
- { id: diepkloof, name: แหล่งมนุษย์ยุคไพลสโตซีน ในแอฟริกาใต้, en: Pleistocene Sites of South Africa, shape: cave, site: true, civ: paleolithic, lat: -32.3864, lon: 18.4525, built: -10000, size: 50, whs: 1723, inscribed: 2024, wiki: "Diepkloof Rock Shelter", desc: "เพิงผาและถ้ำริมฝั่งที่พบร่องรอยพฤติกรรมของมนุษย์สมัยใหม่ยุคแรก เช่นลายสลักบนเปลือกไข่นกกระจอกเทศ", uncertain: "ร่องรอยในถ้ำเหล่านี้อายุราว 60,000–160,000 ปี เก่ากว่าเส้นเวลาของแผนที่มาก" }
- { id: diy-gid-biy, name: ดีย์-กิด-บีย์, en: Diy-Gid-Biy, shape: citadel, civ: central-africa, lat: 10.9167, lon: 13.8333, built: 1300, size: 50, whs: 1745, inscribed: 2025, wiki: "Diy-Gid-Biy", desc: "ลานหินก่อแห้งบนเนินเขามันดาราในแคเมอรูน สร้างไว้ทำอะไรยังเป็นปริศนา", builtRange: [1100, 1700], uncertain: "ไม่รู้ว่าใครสร้าง ผลหาอายุชี้ไปราวศตวรรษที่ 12 ถึง 17" }
- { id: rocas-sao-tome, name: ไร่โรซาส แห่งเซาตูเมและปรินซีปี, en: Roças of São Tomé and Príncipe, shape: factory, civ: portugal, lat: 0.3173, lon: 6.4984, built: 1880, size: 300, whs: 1750, inscribed: 2026, wiki: "", desc: "ไร่โกโก้และกาแฟอาณานิคมโปรตุเกส ใช้แรงงานบังคับจากแผ่นดินใหญ่ เคยส่งออกโกโก้มากที่สุดในโลก" }
- { id: comoros-medinas, name: เมดินาแห่งรัฐสุลต่าน คอโมโรส, en: Medinas of the Comoros Sultanates, shape: town, civ: swahili, lat: -11.7447, lon: 43.2326, built: 1500, size: 500, whs: 1768, inscribed: 2026, wiki: "", desc: "เมืองเก่ามีกำแพงของรัฐสุลต่านในหมู่เกาะคอโมโรส บ้านหินปะการัง มัสยิด และวังแบบสวาฮีลี" }

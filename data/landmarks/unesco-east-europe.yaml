- { id: krzemionki, name: "เหมืองหินเหล็กไฟคเชมิยอนกี", en: "Krzemionki Flint Mines", shape: factory, civ: megalithic-europe, lat: 50.9680, lon: 21.5023, built: -3900, size: 400, whs: 1599, inscribed: 2019, wiki: "Krzemionki", desc: "เหมืองหินเหล็กไฟลายแถบยุคหินใหม่และยุคสำริด มีปล่องเหมืองกว่า 4,000 ปล่อง ใช้ทำขวานหิน" }
- { id: arslantepe, name: "เนินอาร์สลันเตเป", en: "Arslantepe", shape: mound, civ: neolithic-near-east, lat: 38.3819, lon: 38.3611, built: -3300, size: 200, whs: 1622, inscribed: 2021, wiki: "Arslantepe", desc: "เนินซากเมืองที่มีพระราชวังยุคแรกสุดแห่งหนึ่งราว 3300 ปีก่อน ค.ศ. และพบดาบที่เก่าที่สุดในโลก" }
- { id: gordion, name: "กอร์ดิออน", en: "Gordion", shape: mound, civ: hittite, lat: 39.6505, lon: 31.9785, built: -740, size: 300, whs: 1669, inscribed: 2023, wiki: "Gordion", desc: "เมืองหลวงอาณาจักรฟรีเจีย มีเนินสุสานใหญ่ที่เชื่อมโยงกับกษัตริย์ไมดาส และตำนานเงื่อนกอร์เดียน" }

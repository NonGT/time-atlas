- { id: zagori, name: "หมู่บ้านซาโกรี", en: "Zagori", shape: valley, site: true, civ: balkans, lat: 39.8667, lon: 20.7000, built: 1750, size: 1000, whs: 1695, inscribed: 2023, wiki: "Zagori", desc: "หมู่บ้านหินบนเทือกเขาพินดัสของกรีซ เชื่อมด้วยสะพานหินโค้ง สร้างในศตวรรษที่ 18–19 สมัยออตโตมัน" }
- { id: porolissum-dacian-limes, name: "ป้อมพอโรลิสซุม แนวพรมแดนดาเชีย", en: "Dacian Limes", shape: wall, civ: roman, lat: 47.1808, lon: 23.1594, built: 106, size: 1000, whs: 1718, inscribed: 2024, wiki: "Dacian Limes", desc: "แนวป้อมและค่ายทหารที่โรมันสร้างรอบแคว้นดาเชียหลังพิชิตในปี 106 เมืองพอโรลิสซุมเป็นจุดสำคัญ" }
- { id: mount-olympus, name: "ภูเขาโอลิมปัส", en: "Mount Olympus", shape: mountain, site: true, civ: greek, lat: 40.0783, lon: 22.3489, built: -400, size: 500, whs: 1719, inscribed: 2026, wiki: "Mount Olympus", desc: "ภูเขาสูงสุดของกรีซที่ชาวกรีกเชื่อว่าเป็นที่ประทับของเทพทั้งสิบสององค์ เชิงเขามีเทวสถานเมืองดีออน" }
- { id: sardis, name: "ซาร์ดิสและเนินสุสานบินเตเป", en: "Sardis and Bin Tepe", shape: mound, civ: hittite, lat: 38.4819, lon: 28.0453, built: -560, size: 350, whs: 1731, inscribed: 2025, wiki: "Sardis", desc: "เมืองหลวงอาณาจักรลิเดียที่ผลิตเหรียญกษาปณ์รุ่นแรกของโลก และเนินสุสานกษัตริย์ใหญ่ที่สุดของอานาโตเลีย" }

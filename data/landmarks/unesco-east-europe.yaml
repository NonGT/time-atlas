- { id: tarnowskie-gory-mine, name: "เหมืองตาร์นอฟสกีเยกูรึ", en: "Tarnowskie Góry Mine", shape: factory, civ: germany, lat: 50.4427, lon: 18.8512, built: 1784, size: 300, whs: 1539, inscribed: 2017, wiki: "Tarnowskie Góry", desc: "เหมืองตะกั่ว เงิน และสังกะสีใต้ดินในไซลีเซีย พร้อมระบบระบายน้ำใต้ดินที่ทำให้ขุดลึกได้ต่อเนื่อง" }
- { id: zatec-hops, name: "ฌาแตตส์ เมืองฮอปซาซ", en: "Žatec and Saaz Hops", shape: town, civ: central-europe, lat: 50.3296, lon: 13.5445, built: 1880, size: 800, whs: 1558, inscribed: 2023, wiki: "Žatec", desc: "เมืองแปรรูปและค้าฮอปซาซที่ใช้ทำเบียร์ลาเกอร์ทั่วโลก มีโกดังและเตาอบฮอปจากศตวรรษที่ 19" }

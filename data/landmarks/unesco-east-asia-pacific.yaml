- { id: kakadu, name: "อุทยานแห่งชาติคาคาดู", en: "Kakadu National Park", shape: rockart, site: true, civ: aboriginal, lat: -12.4097, lon: 132.9553, built: -10000, size: 1000, whs: 147, inscribed: 1981, wiki: "Kakadu National Park", builtRange: [-63000, -10000], desc: "ภาพเขียนบนหินของชาวอะบอริจินที่อูเบอร์และนูร์แลงกี บันทึกชีวิตผู้คนต่อเนื่องหลายหมื่นปี", uncertain: "ชาวอะบอริจินอยู่ที่นี่อย่างน้อยราว 65,000 ปี แต่อายุของภาพเขียนแต่ละภาพยังไม่แน่ชัด" }

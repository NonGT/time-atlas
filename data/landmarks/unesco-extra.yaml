- { id: melka-kunture, name: "แหล่งโบราณคดี เมลกากุนตูเร", en: "Melka Kunture", shape: terrace, civ: paleolithic, lat: 8.7025, lon: 38.6083, built: -10000, size: 1000, whs: 13, inscribed: 2024, wiki: "Melka Kunture", builtRange: [-2000000, -10000], desc: "แหล่งโบราณคดีริมแม่น้ำอาวาชบนที่สูงเอธิโอเปีย พบเครื่องมือหินและร่องรอยมนุษย์ยุคแรกต่อเนื่องเกือบสองล้านปี", uncertain: "ร่องรอยมนุษย์เก่าที่สุดที่นี่มีอายุราวสองล้านปี เก่ากว่าช่วงเวลาของแผนที่" }

# Thai temples, palaces and historic places outside the UNESCO list (the UNESCO ones are in unesco-thailand.yaml and landmarks.yaml).

- { id: wat-phra-kaew, name: วัดพระศรีรัตนศาสดาราม (วัดพระแก้ว), en: Wat Phra Kaew, shape: hall, city: bangkok, lat: 13.7516, lon: 100.4927, built: 1784, size: 200, height: 40, wiki: "Wat Phra Kaew", desc: "วัดในพระบรมมหาราชวังที่ประดิษฐานพระแก้วมรกต พระอุโบสถหลังคาซ้อนชั้นประดับกระจก มีพระศรีรัตนเจดีย์สีทอง ปราสาทพระเทพบิดร และยักษ์ทวารบาล" }
- { id: wat-pho, name: วัดพระเชตุพน (วัดโพธิ์), en: Wat Pho, shape: hall, city: bangkok, lat: 13.7465, lon: 100.4930, built: 1788, size: 200, height: 42, wiki: "Wat Pho", desc: "รัชกาลที่ 1 สร้างขึ้นใหม่บนวัดเก่าสมัยอยุธยา มีพระพุทธไสยาสน์ยาว 46 เมตร และพระมหาเจดีย์สี่รัชกาลประดับกระเบื้องสี เป็นแหล่งตำราแพทย์แผนไทย" }
- { id: golden-mount, name: ภูเขาทอง วัดสระเกศ, en: Golden Mount (Wat Saket), shape: stupa, city: bangkok, lat: 13.7538, lon: 100.5066, built: 1865, size: 100, height: 80, wiki: "Wat Saket", desc: "รัชกาลที่ 3 เริ่มก่อเจดีย์ใหญ่แต่ทรุดเพราะดินอ่อน รัชกาลที่ 4 ก่อเป็นภูเขาจำลองแทน รัชกาลที่ 5 สร้างเจดีย์ทองบนยอดบรรจุพระบรมสารีริกธาตุ" }
- { id: loha-prasat, name: โลหะปราสาท วัดราชนัดดาราม, en: Loha Prasat (Wat Ratchanatdaram), shape: prang, city: bangkok, lat: 13.7547, lon: 100.5034, built: 1846, size: 60, height: 36, wiki: "Wat Ratchanatdaram", desc: "รัชกาลที่ 3 สร้างตามแบบโลหะปราสาทในลังกาและอินเดีย สามชั้น ยอดโลหะ 37 ยอดเท่าโพธิปักขิยธรรม เป็นโลหะปราสาทหลังเดียวที่เหลืออยู่ในโลก" }
- { id: wat-suthat, name: วัดสุทัศนเทพวราราม และเสาชิงช้า, en: Wat Suthat and the Giant Swing, shape: hall, city: bangkok, lat: 13.7510, lon: 100.5013, built: 1847, size: 150, height: 30, wiki: "Wat Suthat", desc: "พระวิหารหลวงประดิษฐานพระศรีศากยมุนีที่อัญเชิญจากสุโขทัย หน้าวัดมีเสาชิงช้าสีแดงที่ใช้ในพิธีตรียัมปวาย" }
- { id: wat-benchamabophit, name: วัดเบญจมบพิตร ดุสิตวนาราม, en: Wat Benchamabophit (Marble Temple), shape: hall, city: bangkok, lat: 13.7666, lon: 100.5142, built: 1899, size: 80, height: 25, wiki: "Wat Benchamabophit", desc: "พระอุโบสถหินอ่อนอิตาลี ออกแบบโดยสมเด็จฯ กรมพระยานริศรานุวัดติวงศ์ ผสมแบบแผนไทยกับวัสดุตะวันตก ภาพนี้อยู่บนเหรียญห้าบาท" }
- { id: phra-sumen-fort, name: ป้อมพระสุเมรุ, en: Phra Sumen Fort, shape: castle, city: bangkok, lat: 13.7640, lon: 100.4957, built: 1783, size: 45, height: 17, wiki: "Phra Sumen Fort", desc: "ป้อมแปดเหลี่ยมริมแม่น้ำเจ้าพระยา หนึ่งในสองป้อมที่เหลือจากกำแพงพระนครที่รัชกาลที่ 1 สร้าง" }
- { id: ananta-samakhom, name: พระที่นั่ง อนันตสมาคม, en: Ananta Samakhom Throne Hall, shape: dome, city: bangkok, lat: 13.7712, lon: 100.5130, built: 1915, size: 110, height: 49, wiki: "Ananta Samakhom Throne Hall", desc: "ท้องพระโรงหินอ่อนแบบเรอเนสซองซ์อิตาลี สร้างในรัชกาลที่ 5 เสร็จในรัชกาลที่ 6 ใช้เป็นที่ประชุมรัฐสภาแห่งแรกหลังการเปลี่ยนแปลงการปกครอง 2475" }
- { id: democracy-monument, name: อนุสาวรีย์ ประชาธิปไตย, en: Democracy Monument, shape: monolith, city: bangkok, lat: 13.7567, lon: 100.5018, built: 1940, size: 50, height: 24, wiki: "Democracy Monument", desc: "อนุสรณ์การเปลี่ยนแปลงการปกครอง 2475 ป้อมรูปปีกสี่ปีกสูง 24 เมตรรอบพานรัฐธรรมนูญ ต่อมาเป็นจุดชุมนุมของเหตุการณ์ 14 ตุลา 2516 และพฤษภา 2535" }
- { id: victory-monument, name: อนุสาวรีย์ ชัยสมรภูมิ, en: Victory Monument, shape: tower, city: bangkok, lat: 13.7650, lon: 100.5383, built: 1941, size: 40, height: 50, wiki: "Victory Monument (Bangkok)", desc: "สร้างเป็นอนุสรณ์กรณีพิพาทอินโดจีนฝรั่งเศส 2483 เสาดาบปลายปืนห้าเล่มรอบรูปปั้นทหาร ตำรวจ และพลเรือน" }
- { id: phra-nakhon-khiri, name: พระนครคีรี (เขาวัง), en: Phra Nakhon Khiri, shape: citadel, civ: siam, lat: 13.1084, lon: 99.9389, built: 1860, size: 400, height: 92, wiki: "Phra Nakhon Khiri", desc: "พระราชวังฤดูร้อนของรัชกาลที่ 4 บนเขาสามยอดที่เพชรบุรี มีพระที่นั่ง หอชัชวาลเวียงชัยสำหรับดูดาว และพระธาตุจอมเพชร" }
- { id: bang-pa-in, name: พระราชวัง บางปะอิน, en: Bang Pa-In Royal Palace, shape: garden, city: ayutthaya, lat: 14.2324, lon: 100.5797, built: 1872, size: 300, height: 20, wiki: "Bang Pa-In Royal Palace", desc: "วังริมน้ำที่พระเจ้าปราสาททองสร้างไว้ และรัชกาลที่ 5 ฟื้นขึ้นใหม่ มีพระที่นั่งไอศวรรย์ทิพยอาสน์กลางสระ และอาคารแบบจีนกับยุโรป" }
- { id: wat-chaiwatthanaram, name: วัดไชยวัฒนาราม, en: Wat Chaiwatthanaram, shape: prang, city: ayutthaya, lat: 14.3430, lon: 100.5419, built: 1630, size: 200, height: 35, wiki: "Wat Chaiwatthanaram", desc: "พระเจ้าปราสาททองสร้างริมแม่น้ำเจ้าพระยา ปรางค์ประธานแบบเขมรล้อมด้วยปรางค์ทิศและเมรุทิศแปดองค์ ถูกเผาเมื่อกรุงแตก 2310" }
- { id: wat-yai-chai-mongkhon, name: วัดใหญ่ชัยมงคล, en: Wat Yai Chai Mongkhon, shape: stupa, city: ayutthaya, lat: 14.3453, lon: 100.5925, built: 1592, size: 100, height: 60, wiki: "Wat Yai Chai Mongkhon", desc: "เจดีย์ใหญ่ที่พงศาวดารเล่าว่าสมเด็จพระนเรศวรสร้างเฉลิมชัยหลังชนะศึกยุทธหัตถี มีพระพุทธรูปเรียงรอบลาน", uncertain: "ปีสร้างเจดีย์มาจากพงศาวดาร ซึ่งเขียนหลังเหตุการณ์นานและแต่ละฉบับไม่ตรงกัน" }
- { id: wat-phra-si-rattana-mahathat-phitsanulok, name: วัดพระศรีรัตนมหาธาตุ พิษณุโลก, en: Wat Phra Si Rattana Mahathat (Phitsanulok), shape: prang, civ: sukhothai, lat: 16.8265, lon: 100.2610, built: 1357, size: 100, height: 36, wiki: "Wat Phra Si Rattana Mahathat (Phitsanulok)", desc: "วัดของพระพุทธชินราช ที่นับกันว่างดงามที่สุดของไทย พระปรางค์องค์ใหญ่สร้างทับเจดีย์เดิมในสมัยอยุธยา" }
- { id: prang-sam-yot, name: พระปรางค์สามยอด ลพบุรี, en: Phra Prang Sam Yot, shape: prang, civ: khmer, lat: 14.8030, lon: 100.6143, built: 1200, size: 40, height: 21, wiki: "Phra Prang Sam Yot", builtRange: [1180, 1220], desc: "ปรางค์ศิลาแลงสามองค์เรียงต่อกันแบบบายน เดิมเป็นเทวสถานของเขมร ภายหลังดัดแปลงเป็นวัดพุทธ", uncertain: "ปีสร้างประมาณจากรูปแบบศิลปะสมัยพระเจ้าชัยวรมันที่ 7" }
- { id: phimai, name: ปราสาทหินพิมาย, en: Prasat Hin Phimai, shape: prang, civ: khmer, lat: 15.2210, lon: 102.4937, built: 1080, size: 80, height: 28, wiki: "Prasat Hin Phimai", builtRange: [1050, 1110], desc: "ปราสาทหินทรายขาวพุทธมหายานที่ใหญ่ที่สุดในไทย ปลายถนนโบราณจากเมืองพระนคร ปรางค์ประธานเป็นต้นแบบให้นครวัด", uncertain: "ปีสร้างประมาณจากจารึกและศิลปะสมัยพระเจ้าชัยวรมันที่ 6" }
- { id: phanom-rung, name: ปราสาทหิน พนมรุ้ง, en: Phanom Rung, shape: prang, civ: khmer, lat: 14.5322, lon: 102.9420, built: 1150, size: 160, height: 27, wiki: "Phanom Rung Historical Park", builtRange: [1100, 1180], desc: "เทวสถานพระศิวะบนยอดภูเขาไฟที่ดับแล้ว ทางเดินมีเสานางเรียง สะพานนาคสามชั้นนำขึ้นสู่ปราสาท ทับหลังนารายณ์บรรทมสินธุ์ได้คืนจากสหรัฐฯ ในปี 1988", uncertain: "ปราสาทประธานสร้างราวต้นถึงกลางพุทธศตวรรษที่ 17 แต่ศาสนสถานบนเขามีมาตั้งแต่ศตวรรษที่ 10" }
- { id: doi-suthep, name: วัดพระธาตุ ดอยสุเทพ, en: Wat Phra That Doi Suthep, shape: stupa, civ: lanna, lat: 18.8048, lon: 98.9216, built: 1386, size: 60, height: 24, wiki: "Wat Phra That Doi Suthep", desc: "ตำนานเล่าว่าพญากือนาให้ช้างเผือกบรรทุกพระธาตุขึ้นดอย ช้างหยุดที่ใดก็สร้างวัดที่นั่น เจดีย์ทองทรงล้านนา ขึ้นด้วยบันไดนาค 306 ขั้น", uncertain: "ปีสร้างมาจากตำนาน ซึ่งแต่ละฉบับให้ปีต่างกันเล็กน้อย" }
- { id: phra-that-phanom, name: พระธาตุพนม, en: Phra That Phanom, shape: stupa, civ: lan-xang, lat: 16.9423, lon: 104.7236, built: 800, size: 30, height: 53, wiki: "Phra That Phanom", builtRange: [500, 1000], desc: "พระธาตุทรงบัวเหลี่ยมริมโขง ที่นับถือทั้งสองฝั่งโขง ล้านช้างบูรณะต่อเติมหลายครั้ง พังลงทั้งองค์ในปี 1975 และสร้างใหม่เสร็จปี 1979", uncertain: "ตำนานอุรังคธาตุว่าเก่าถึงสมัยพุทธกาล ฐานอิฐชั้นล่างอาจราวพุทธศตวรรษที่ 13 ถึง 15" }
- { id: river-kwai-bridge, name: สะพาน ข้ามแม่น้ำแคว, en: Bridge over the River Kwai, shape: bridge, civ: siam, lat: 14.0410, lon: 99.5036, built: 1943, size: 300, height: 10, wiki: "Burma Railway", desc: "สะพานเหล็กของทางรถไฟสายมรณะที่ญี่ปุ่นใช้เชลยศึกและแรงงานเอเชียสร้างไปพม่า ถูกทิ้งระเบิดในปี 1945 ช่วงกลางที่ซ่อมใหม่จึงเป็นโครงเหลี่ยมต่างจากช่วงโค้งเดิม" }
- { id: hellfire-pass, name: ช่องเขาขาด, en: Hellfire Pass, shape: wall, civ: siam, lat: 14.3517, lon: 98.9551, built: 1943, size: 500, height: 25, wiki: "Hellfire Pass", desc: "ร่องหินที่เชลยศึกขุดด้วยมือและสิ่ว ทำงานกลางคืนใต้แสงคบไฟจนได้ชื่อช่องไฟนรก ใช้เวลาราว 12 สัปดาห์ มีผู้เสียชีวิตจำนวนมาก" }

- { id: san-antonio-missions, name: มิชชันซานอันโตนิโอ, en: San Antonio Missions, shape: church, civ: spain, lat: 29.426, lon: -98.4861, built: 1756, size: 100, whs: 1466, inscribed: 2015, wiki: "San Antonio Missions (World Heritage Site)", desc: "มิชชันสเปน 5 แห่งในเท็กซัส รวมถึงอะลาโมที่เป็นสมรภูมิสำคัญในการปฏิวัติเท็กซัสปี 1836" }
- { id: antigua-naval-dockyard, name: อู่เรือหลวงแอนติกา, en: Antigua Naval Dockyard, shape: factory, civ: england, lat: 17.0045, lon: -61.7601, built: 1745, size: 300, whs: 1499, inscribed: 2016, wiki: "Antigua Naval Dockyard and Related Archaeological Sites", desc: "อู่ซ่อมเรือของกองทัพเรืออังกฤษในอ่าวอิงลิชฮาร์เบอร์ สร้างด้วยแรงงานทาส ยังใช้งานอยู่ถึงทุกวันนี้" }
- { id: trondek-klondike, name: ตรอนเดก–คลอนไดก์, en: Tr'ondëk-Klondike, shape: town, civ: canada, lat: 64.06, lon: -139.43, built: 1897, size: 1000, whs: 1564, inscribed: 2023, wiki: "Tr'ondëk-Klondike", desc: "ดินแดนตื่นทองคลอนไดก์รอบเมืองดอว์สัน และการปรับตัวของชาวพื้นเมืองตรอนเดกฮเวชอินต่อการล่าอาณานิคม" }
- { id: panama-transisthmian-route, name: เส้นทางข้ามคอคอดปานามา, en: Colonial Transisthmian Route of Panamá, shape: wall, civ: spain, lat: 9.1, lon: -79.62, built: 1520, size: 1000, whs: 1582, inscribed: 2025, wiki: "The Colonial Transisthmian Route of Panamá", desc: "ทางบกและทางเรือที่สเปนใช้ขนเงินจากแปซิฟิกข้ามคอคอดไปยังทะเลแคริบเบียน" }
- { id: port-royal, name: พอร์ตรอยัล, en: Port Royal, shape: town, civ: england, lat: 17.9375, lon: -76.8414, built: 1655, size: 500, whs: 1595, inscribed: 2025, wiki: "Port Royal", desc: "เมืองท่าโจรสลัดของอังกฤษในจาเมกา ส่วนใหญ่จมลงทะเลในแผ่นดินไหวปี 1692" }
- { id: writing-on-stone, name: ภาพสลักหินไรทิงออนสโตน, en: Writing-on-Stone (Áísínai'pi), shape: rockart, civ: native-north-america, lat: 49.0819, lon: -111.617, built: -1000, size: 500, whs: 1597, inscribed: 2019, wiki: "Writing-on-Stone Provincial Park", builtRange: [-3000, -500], desc: "ภาพสลักและภาพเขียนนับพันบนผาหินทรายของชาวแบล็กฟุต ยังเป็นสถานที่ศักดิ์สิทธิ์จนทุกวันนี้", uncertain: "อายุของภาพที่เก่าที่สุดประมาณได้แค่คร่าว ๆ" }
- { id: takalik-abaj, name: ตากาลิกอาบัฮ, en: Takalik Abaj, shape: step, civ: maya, lat: 14.6458, lon: -91.7361, built: -800, size: 300, whs: 1663, inscribed: 2023, wiki: "Takalik Abaj", desc: "เมืองโบราณในกัวเตมาลาที่มีประติมากรรมทั้งแบบโอลเมกและมายายุคแรก แสดงช่วงเปลี่ยนผ่านของสองวัฒนธรรม" }
- { id: hopewell-earthworks, name: คันดินพิธีกรรมโฮปเวลล์, en: Hopewell Ceremonial Earthworks, shape: ring, civ: native-north-america, lat: 40.0537, lon: -82.4461, built: 100, size: 600, whs: 1689, inscribed: 2023, wiki: "Hopewell Ceremonial Earthworks", builtRange: [1, 400], desc: "คันดินรูปวงกลมและแปดเหลี่ยมขนาดใหญ่ในโอไฮโอ วางแนวตามรอบการขึ้นตกของดวงจันทร์", uncertain: "สร้างในช่วงวัฒนธรรมโฮปเวลล์ ราว ค.ศ. 1–400 แต่ไม่รู้ปีแน่ชัด" }
- { id: huichol-route-wirikuta, name: เส้นทางแสวงบุญวิซาริกา สู่วิริกูตา, en: Huichol Route to Wirikuta, shape: mountain, site: true, civ: mesoamerica, lat: 23.9333, lon: -100.7667, built: 1300, size: 2000, whs: 1704, inscribed: 2025, wiki: "Huichol Route to Huiricuta", builtRange: [800, 1600], desc: "เส้นทางแสวงบุญราว 500 กม. ของชาววิซาริกา (อุยโชล) สู่ทะเลทรายศักดิ์สิทธิ์วิริกูตา ยังเดินกันจนทุกวันนี้", uncertain: "เส้นทางมีมาก่อนสเปนเข้ามา แต่ไม่รู้ว่าเริ่มใช้เมื่อไร" }

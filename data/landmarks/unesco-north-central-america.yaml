- { id: historic-cienfuegos, name: เมืองเก่าเซียนฟวยโกส, en: Historic Centre of Cienfuegos, shape: town, civ: france, lat: 22.1456, lon: -80.4364, built: 1819, size: 1000, whs: 1202, inscribed: 2005, wiki: "Historic Centre of Cienfuegos", desc: "เมืองที่ผู้อพยพชาวฝรั่งเศสก่อตั้งในคิวบาสมัยสเปนปกครอง วางผังตามแนวคิดเมืองสมัยใหม่ของศตวรรษที่ 19" }

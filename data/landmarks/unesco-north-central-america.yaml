- { id: ciudad-universitaria, name: เมืองมหาวิทยาลัย UNAM, en: Ciudad Universitaria (UNAM), shape: hall, civ: modern, lat: 19.3322, lon: -99.1881, built: 1954, size: 800, whs: 1250, inscribed: 2007, wiki: "Ciudad Universitaria, Mexico City", desc: "วิทยาเขตมหาวิทยาลัยแห่งชาติเม็กซิโก ผสมสถาปัตยกรรมสมัยใหม่กับจิตรกรรมฝาผนังขนาดใหญ่" }
- { id: historic-camaguey, name: เมืองเก่ากามากวย, en: Historic Centre of Camagüey, shape: town, civ: spain, lat: 21.3808, lon: -77.9169, built: 1528, size: 1500, whs: 1270, inscribed: 2008, wiki: "Camagüey", desc: "เมืองอาณานิคมในแผ่นดินคิวบาที่ถนนคดเคี้ยวเป็นเขาวงกต ต่างจากผังตารางของเมืองสเปนทั่วไป" }
- { id: san-miguel-de-allende, name: ซานมิเกลเดอาเยนเด, en: San Miguel de Allende, shape: town, civ: spain, lat: 20.9144, lon: -100.7464, built: 1555, size: 1000, whs: 1274, inscribed: 2008, wiki: "San Miguel de Allende", desc: "เมืองป้อมบนเส้นทางขนเงิน รุ่งเรืองในศตวรรษที่ 18 คู่กับวิหารอาโตโตนิลโกที่มีจิตรกรรมฝาผนังบาโรก" }
- { id: papahanaumokuakea, name: ปาปาฮาเนามอกูอาเกอา, en: Papahānaumokuākea, shape: islands, site: true, civ: polynesia, lat: 23.575, lon: -164.7, built: 1000, size: 300, whs: 1326, inscribed: 2010, wiki: "Papahānaumokuākea Marine National Monument", builtRange: [1000, 1500], desc: "เขตอนุรักษ์ทะเลหมู่เกาะฮาวายตะวันตกเฉียงเหนือ เกาะโมกูมานามานามีลานพิธีกรรมและหินตั้งของชาวฮาวายโบราณ", uncertain: "ไม่รู้แน่ชัดว่าชาวฮาวายสร้างลานพิธีกรรมบนเกาะเหล่านี้เมื่อไร" }
- { id: camino-real-tierra-adentro, name: เส้นทางกามิโนเรอัล เดเตียร์ราอาเดนโตร, en: Camino Real de Tierra Adentro, shape: wall, civ: spain, lat: 22.6081, lon: -102.3792, built: 1598, size: 2000, whs: 1351, inscribed: 2010, wiki: "Camino Real de Tierra Adentro", desc: "เส้นทางการค้าเงินยาวกว่า 2,500 กม. จากเม็กซิโกซิตีขึ้นเหนือไปถึงซานตาเฟ" }
- { id: yagul-mitla-caves, name: ถ้ำก่อนประวัติศาสตร์ ยากูลและมิตลา, en: Caves of Yagul and Mitla, shape: cave, site: true, civ: mesoamerica, lat: 16.9508, lon: -96.4211, built: -8000, size: 500, whs: 1352, inscribed: 2010, wiki: "Prehistoric Caves of Yagul and Mitla in the Central Valley of Oaxaca", builtRange: [-9000, -6000], desc: "ถ้ำในหุบเขาโออาฮากาที่พบเมล็ดน้ำเต้าปลูกเก่าแก่ที่สุดในอเมริกา หลักฐานจุดเริ่มต้นการเพาะปลูก", uncertain: "อายุของหลักฐานการเพาะปลูกในถ้ำประมาณจากการหาอายุด้วยคาร์บอน" }
- { id: historic-bridgetown, name: บริดจ์ทาวน์เก่าและกองทหาร, en: Historic Bridgetown and its Garrison, shape: town, civ: england, lat: 13.0967, lon: -59.6139, built: 1628, size: 1000, whs: 1376, inscribed: 2011, wiki: "Bridgetown", desc: "เมืองท่าอาณานิคมอังกฤษในบาร์เบโดส กับฐานทัพที่คุ้มครองการค้าน้ำตาลและทาสในแคริบเบียน" }
- { id: grand-pre, name: ภูมิทัศน์กร็องเปร, en: Landscape of Grand-Pré, shape: hills, site: true, civ: france, lat: 45.1089, lon: -64.3092, built: 1682, size: 2000, whs: 1404, inscribed: 2012, wiki: "Grand-Pré, Nova Scotia", desc: "ทุ่งที่ชาวอาเคเดียนสร้างคันดินกั้นน้ำทะเล และเป็นสัญลักษณ์ของการขับไล่ชาวอาเคเดียนในปี 1755" }
- { id: red-bay, name: สถานีล่าวาฬเรดเบย์, en: Red Bay Basque Whaling Station, shape: factory, civ: spain, lat: 51.7269, lon: -56.4295, built: 1550, size: 300, whs: 1412, inscribed: 2013, wiki: "Red Bay National Historic Site", desc: "สถานีต้มน้ำมันวาฬของชาวบาสก์ในแลบราดอร์ศตวรรษที่ 16 พบซากเรือล่าวาฬจมอยู่ในอ่าว" }
- { id: poverty-point, name: โพเวอร์ตีพอยต์, en: Poverty Point, shape: ring, civ: native-north-america, lat: 32.6375, lon: -91.4069, built: -1600, size: 1200, whs: 1435, inscribed: 2014, wiki: "Poverty Point", desc: "คันดินรูปครึ่งวงกลมซ้อนกันหกชั้น สร้างโดยกลุ่มล่าสัตว์และเก็บของป่า ไม่ใช่ชาวนา" }
- { id: diquis-stone-spheres, name: ลูกหินกลมแห่งดิกิส, en: Diquís Stone Spheres, shape: monolith, civ: mesoamerica, lat: 8.9385, lon: -83.5025, built: 600, size: 100, whs: 1453, inscribed: 2014, wiki: "Stone spheres of Costa Rica", builtRange: [500, 1500], desc: "ลูกหินกลมเกือบสมบูรณ์ ใหญ่สุดกว้างกว่า 2 เมตร ตั้งอยู่ในชุมชนหัวหน้าเผ่าโบราณของคอสตาริกา", uncertain: "ไม่รู้ว่าแกะสลักเมื่อไรแน่ชัด ประมาณจากชั้นดินระหว่าง ค.ศ. 500–1500" }

# Timeline events. Every .yaml file in this folder is read, so new sets (wars.yaml, pandemics.yaml...) can go in their own file.
# id: a-z0-9- name, unique across all event files. Translations in data/i18n/<lang>/events/ are keyed by it.
# importance: 1 minor, 2 major, 3 very major (playback stops there when that option is on).
#   Where marks overlap on the timeline the smaller ones step aside, so minor events show up as you zoom in.
# tag: founding, culture, war, tech, religion, politics, disaster
# end: last year of something that lasted (a war, a pandemic). Drawn as a bar on the timeline.
# Place: city uses that city's position, or give lat/lon (zoom optional).
# uncertain: what is unclear about it. Hidden by the "uncertain" toggle.
# range: [from, to] possible years, drawn as a hatched band on the timeline. Needs uncertain.


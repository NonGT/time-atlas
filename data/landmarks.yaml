# Landmarks at their real coordinates. They appear in `built` and disappear in `gone`, if set.
# shape is the generic model; a landmark with its own model in src/map/models/ (keyed by id) uses that instead.
# shape: pyramid, ziggurat, step, temple, arena, dome, pagoda, hall, prang, stupa, citadel, mound, ring, tower, cathedral,
#   town, cave, terrace, bridge, castle, wall, factory, monolith, mosque, church, garden,
#   and for places that are not buildings (with site: true) mountain, volcano, hills, valley, lake, forest, rockart, islands
# whs, inscribed: UNESCO World Heritage site number and the year it was inscribed. More sites are in landmarks/.
# Use civ instead of city for a landmark outside any city (e.g. Borobudur).
# size: rough real width in meters; it is drawn larger so it can be seen.
# height: real height in meters of the tallest part (relief for a natural place); the model is scaled to it.
# city or civ is required, it sets the color.
# uncertain: what is unclear about it. Drawn see-through and hidden by the "ไม่แน่ชัด" toggle.
# wiki: English Wikipedia page for the photo, defaults to en. wiki: "" shows no photo.
# builtRange, goneRange: possible years it was built or lost. Needs uncertain.


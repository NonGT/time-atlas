# English for data/landmarks/unesco-north-central-america.yaml.

lanse-aux-meadows:
  desc: A Norse Viking camp on Newfoundland, the first evidence that Europeans reached the Americas, some 500 years before Columbus.
  uncertain: Wood cut in 1021 proves people were there that year, but when the camp was first set up is unknown.
mesa-verde:
  desc: Cliff dwellings of the Ancestral Puebloans, such as Cliff Palace, built into rock alcoves around 1190–1260.
antigua-guatemala:
  desc: The former Spanish colonial capital of Central America; many of its Baroque churches fell in the 1773 earthquake and remain as ruins.
independence-hall:
  desc: The Philadelphia building where the US Declaration of Independence (1776) was signed and the Constitution (1787) drafted.
copan:
  desc: A Maya city in Honduras, known for its sculpted stelae and the longest Maya hieroglyphic stairway.
portobelo-san-lorenzo:
  desc: Spanish forts on Panama's Caribbean coast, guarding the route that carried Peruvian silver across the isthmus to Spain.
quirigua:
  desc: A Maya city in Guatemala with the tallest stela of the Maya world, Stela E, about 10 metres high.
sgang-gwaay:
  desc: An abandoned Haida village on an island off Canada's coast, with carved wooden totem poles still standing where they were raised.
  uncertain: The village was lived in for thousands of years; the surviving poles were carved in the 19th century, exact years unknown.
head-smashed-in:
  desc: A cliff where Plains peoples drove bison herds over the edge, used for hunting for about 5,700 years.
  uncertain: Its first use is estimated from the excavated bone deposits.
old-havana:
  desc: A Spanish colonial port and fortification system where the treasure fleets gathered before crossing the Atlantic.
san-juan-forts:
  desc: Spanish forts at the mouth of San Juan Bay, Puerto Rico; La Fortaleza is the oldest governor's residence still in use in the Americas.
old-quebec:
  desc: Founded by the French in 1608, the only city north of Mexico that still has its full city walls.
statue-of-liberty:
  desc: A copper statue given by France to the United States, a symbol of welcome for immigrants arriving in New York harbour.
palenque:
  desc: A Maya city in the Chiapas forest; the Temple of the Inscriptions holds the tomb of King Pakal the Great.
monte-alban:
  desc: A Zapotec city on a levelled hilltop above the old town of Oaxaca, which is part of the same World Heritage site.
historic-puebla:
  desc: A grid-planned Spanish colonial city known for its Baroque churches and Talavera tiles.
monticello:
  desc: The house Thomas Jefferson designed for himself, together with the University of Virginia he founded and planned.
trinidad-cuba:
  desc: A colonial town made rich by the sugar mills of the nearby valley, preserved as it was in the 18th–19th centuries.
historic-guanajuato:
  desc: A silver-mining town in a narrow valley that produced more silver than anywhere else in the world in the 18th century.
colonial-santo-domingo:
  desc: The oldest European city still inhabited in the Americas, with the first cathedral in the hemisphere.
historic-morelia:
  desc: A colonial city built of pink stone, with more than 200 buildings from the colonial period.
leon-viejo:
  desc: An early Spanish colonial town in Nicaragua, abandoned after the 1610 earthquake and buried by volcanic ash.
el-tajin:
  desc: An ancient city in Veracruz, known for the Pyramid of the Niches with its 365 niches.
  uncertain: The date of the Pyramid of the Niches is debated, estimated between 800 and 1150.
joya-de-ceren:
  desc: A Maya farming village buried whole by volcanic ash, so daily life is preserved as at Pompeii.
  uncertain: When the village was founded is unknown; only that it was buried around the end of the 6th century.
historic-zacatecas:
  desc: A silver-mining town in a valley, with a pink sandstone Baroque cathedral covered in dense carving.
popocatepetl-monasteries:
  desc: Fourteen monasteries built by Franciscan, Dominican and Augustinian friars to spread Christianity in the 16th century.
sierra-de-san-francisco:
  desc: Large paintings of people and animals in rock shelters in the Baja California desert.
  uncertain: Dating results vary widely, from about 7,500 years ago to 1300 CE.
old-town-lunenburg:
  desc: A British-planned port town in Nova Scotia that keeps its original grid and colourful wooden houses.
panama-viejo:
  desc: The ruins of the original Panama City, burned by the pirate Henry Morgan in 1671, after which the city moved to today's Casco Viejo.
uxmal:
  desc: A Puuc-style Maya city on the Yucatán Peninsula, with the Pyramid of the Magician on an oval base.
historic-queretaro:
  desc: A colonial city where a grid-planned Spanish quarter sits beside a winding indigenous quarter, with a long arched aqueduct.
hospicio-cabanas:
  desc: A poorhouse in Guadalajara whose dome holds murals by José Clemente Orozco.
willemstad:
  desc: A Dutch West India Company port on Curaçao, with brightly painted Dutch-style houses along the harbour.
san-pedro-de-la-roca:
  desc: A Spanish fort on the cliffs at the mouth of Santiago de Cuba bay, the most complete Renaissance-style fortress in the Caribbean.
tlacotalpan:
  desc: A river port on the Papaloapan with brightly painted colonnaded houses mixing Spanish and Caribbean styles.
campeche:
  desc: A colonial port town ringed by a hexagonal wall built against pirates.
brimstone-hill:
  desc: A British fortress on a volcanic hill on St Kitts, built by enslaved Africans over the 18th century.
xochicalco:
  desc: A hilltop city that flourished after the fall of Teotihuacan, with a finely carved Temple of the Feathered Serpent.
cuba-coffee-plantations:
  desc: Ruins of hillside coffee plantations set up by French planters fleeing Haiti and worked by enslaved people in the 19th century.
sierra-gorda-missions:
  desc: Five mission churches with folk-Baroque stucco facades, built by the Pame people with Franciscan friars.
barragan-house:
  desc: The home of architect Luis Barragán, blending modern architecture with bright walls and Mexican gardens.
historic-cienfuegos:
  desc: A city founded by French settlers in Spanish-ruled Cuba, laid out on 19th-century ideas of modern town planning.
tequila-agave-landscape:
  desc: Blue agave fields and old distilleries, the birthplace of tequila.
rideau-canal:
  desc: A canal linking Ottawa and Kingston built by the British for military use, the best-preserved working canal of its era in North America.
ciudad-universitaria:
  desc: The campus of Mexico's national university, combining modern architecture with large murals.
historic-camaguey:
  desc: An inland Cuban colonial city whose maze of winding streets departs from the usual Spanish grid.
san-miguel-de-allende:
  desc: A fortified town on the silver route that flourished in the 18th century, paired with the Atotonilco sanctuary and its Baroque murals.
papahanaumokuakea:
  desc: A marine reserve in the Northwestern Hawaiian Islands; Mokumanamana island has ancient Hawaiian ritual platforms and upright stones.
  uncertain: It is not known exactly when Hawaiians built the ritual platforms on these islands.
camino-real-tierra-adentro:
  desc: A silver trade road over 2,500 km long running north from Mexico City to Santa Fe.
yagul-mitla-caves:
  desc: Caves in the Oaxaca valley with the oldest domesticated squash seeds in the Americas, evidence of the beginnings of farming.
  uncertain: The age of the early farming evidence comes from radiocarbon estimates.
historic-bridgetown:
  desc: A British colonial port in Barbados and the garrison that protected the Caribbean sugar and slave trade.
grand-pre:
  desc: Fields reclaimed from the sea by Acadian dykes, and a symbol of the Acadian expulsion of 1755.
red-bay:
  desc: A 16th-century Basque station in Labrador for rendering whale oil, with sunken whaling ships found in the bay.
poverty-point:
  desc: Six nested half-ring earthen ridges built by hunter-gatherers, not farmers.
diquis-stone-spheres:
  desc: Near-perfect stone spheres, the largest over 2 metres across, standing in ancient chiefdom settlements of Costa Rica.
  uncertain: When they were carved is unknown; soil layers suggest between 500 and 1500.
padre-tembleque-aqueduct:
  desc: A 48 km aqueduct built by a Franciscan friar with indigenous communities, with the tallest single-tier arcade of its time.
san-antonio-missions:
  desc: Five Spanish missions in Texas, including the Alamo, a key battlefield of the 1836 Texas Revolution.
antigua-naval-dockyard:
  desc: A British Royal Navy repair yard at English Harbour, built with enslaved labour and still in use today.
trondek-klondike:
  desc: The Klondike gold rush lands around Dawson City, and how the Tr'ondëk Hwëch'in people adapted to colonisation.
panama-transisthmian-route:
  desc: The land and river route Spain used to carry silver from the Pacific across the isthmus to the Caribbean.
port-royal:
  desc: An English pirate port in Jamaica, most of which sank into the sea in the 1692 earthquake.
writing-on-stone:
  desc: Thousands of carvings and paintings on Blackfoot sandstone cliffs, still a sacred place today.
  uncertain: The age of the oldest images can only be roughly estimated.
takalik-abaj:
  desc: An ancient city in Guatemala with both Olmec and early Maya sculpture, showing the transition between the two cultures.
hopewell-earthworks:
  desc: Huge circular and octagonal earthworks in Ohio, aligned to the cycle of moonrises and moonsets.
  uncertain: Built during the Hopewell culture, around 1–400 CE, exact years unknown.
huichol-route-wirikuta:
  desc: A pilgrimage route of about 500 km taken by the Wixárika (Huichol) to the sacred Wirikuta desert, still walked today.
  uncertain: The route predates the Spanish, but when it came into use is unknown.

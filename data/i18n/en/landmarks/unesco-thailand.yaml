# English for data/landmarks/unesco-thailand.yaml.

khao-klang-nok:
  desc: A great laterite stupa outside Si Thep, 64 metres across, the largest Dvaravati monument still standing.
khao-klang-nai:
  desc: A Dvaravati shrine in the inner city, its base lined with stucco dwarfs holding it up.
prang-si-thep:
  desc: A Khmer-style brick prang on a laterite base, built once Si Thep came under Angkor's influence.
prang-song-phi-nong:
  desc: Two Khmer-style brick prangs standing side by side in the inner city.
ban-chiang:
  desc: A prehistoric farming community with burials, red-painted pottery and some of the earliest bronze in Southeast Asia.
  uncertain: The dates are still argued. It was first thought to go back to 3600 BCE; newer dating puts the start around 2000 BCE and bronze around 1000 BCE.
phu-phrabat:
  desc: Sandstone shelters on a hill ringed by stone sema markers, evidence of the Dvaravati sema tradition, with prehistoric paintings too.
wat-chang-lom-satchanalai:
  desc: A Sri Lankan-style bell stupa on a base ringed by 39 stucco elephants, finished in 1286 according to the Ram Khamhaeng inscription.
wat-phra-mahathat-nakhon:
  desc: A 55-metre Sri Lankan-style bell stupa, the centre of Theravada Buddhism on the Malay peninsula.
  uncertain: When the present bell stupa was built is unclear, probably around the 13th century over an older one.
